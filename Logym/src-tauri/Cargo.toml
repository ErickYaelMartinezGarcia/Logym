[package]
name = "logym"
version = "0.1.0"
description = "GYM OS"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.8", features = [] }
once_cell = "1.19"
chrono = { version = "0.4", features = ["clock"] }
rusqlite = { version = "0.31", features = ["bundled-sqlcipher-vendored-openssl"] }
getrandom = "0.2"
ed25519-dalek = "2.1"
sha2 = "0.10"
argon2 = "0.5"

libloading = "0.8"
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.10"


[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Security_Cryptography", "Win32_System_Memory", "Win32_Foundation", "Win32_System_LibraryLoader", "Win32_Devices_DeviceAndDriverInstallation", "Win32_System_Threading", "Win32_Storage_FileSystem"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
