<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>VIRTUS GYM</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #090a0c; color: #f3f4f6; }
      .app-startup { min-height: 100vh; box-sizing: border-box; display: grid; place-content: center; justify-items: center; gap: 16px; padding: 32px; text-align: center; font-family: system-ui, sans-serif; }
      .app-startup__brand { margin: 0; color: #ee2046; font-size: 24px; font-weight: 800; letter-spacing: .16em; }
      .app-startup__spinner { width: 32px; height: 32px; border: 3px solid #343941; border-top-color: #ee2046; border-radius: 50%; animation: startup-spin 1s linear infinite; }
      .app-startup p { margin: 0; max-width: 420px; line-height: 1.6; }
      .app-startup__hint { color: #aeb3bc; font-size: 13px; }
      .app-startup button { padding: 10px 18px; color: #fff; background: #272b33; border: 1px solid #4c5260; border-radius: 9px; cursor: pointer; }
      @keyframes startup-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .app-startup__spinner { animation: none; } }
    </style>
  </head>
  <body>
    <div id="app">
      <section class="app-startup" aria-label="Iniciando VIRTUS GYM" aria-busy="true">
        <p class="app-startup__brand">VIRTUS GYM</p>
        <span class="app-startup__spinner" aria-hidden="true"></span>
        <p id="startup-status" role="status" aria-live="polite">Abriendo la aplicación…</p>
        <p class="app-startup__hint">Espera un momento mientras preparamos tu acceso.</p>
        <button id="startup-retry" type="button" hidden>Volver a intentar</button>
        <noscript>Activa JavaScript para abrir la aplicación.</noscript>
      </section>
    </div>
    <script src="/arranque.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
